<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>六合餐厅 · 智能助手</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #747a70;
      --line: #e4e8df;
      --green: #1e6b4a;
      --green-soft: #e6f3eb;
      --orange: #d8892b;
      --orange-soft: #fff3df;
      --shadow: 0 18px 50px rgba(35, 55, 39, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, #e7f2e9 0, transparent 32%),
        #f5f7f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: 0.6; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 8px 20px rgba(30, 107, 74, 0.22);
      font-size: 25px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.03em; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 14px; }

    .top-actions { display: flex; align-items: center; gap: 10px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      white-space: nowrap;
    }
    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      content: "";
    }
    .status.online { color: var(--green); }
    .status.online::before { background: #37a66c; }
    .status.error { color: #b74a3c; }
    .status.error::before { background: #d85b4a; }

    .ghost-button, .primary-button, .chip {
      border: 0;
      border-radius: 11px;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .ghost-button:hover, .primary-button:hover, .chip:hover { transform: translateY(-1px); }
    .ghost-button {
      padding: 9px 13px;
      color: var(--green);
      background: var(--green-soft);
      font-size: 13px;
    }
    .primary-button {
      padding: 11px 17px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 7px 16px rgba(30, 107, 74, 0.16);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(310px, 0.65fr);
      gap: 18px;
      align-items: start;
    }

    .card {
      border: 1px solid rgba(218, 226, 216, 0.95);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .chat-card { display: flex; min-height: 650px; flex-direction: column; overflow: hidden; }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }
    .card-head h2 { font-size: 18px; }
    .card-head p { margin-top: 4px; color: var(--muted); font-size: 13px; }

    .messages {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 13px;
      padding: 22px;
      overflow-y: auto;
    }
    .message-row { display: flex; gap: 9px; align-items: flex-end; }
    .message-row.user { justify-content: flex-end; }
    .avatar {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border-radius: 10px;
      color: var(--green);
      background: var(--green-soft);
      font-size: 15px;
    }
    .user .avatar { order: 2; color: #995617; background: var(--orange-soft); }
    .bubble {
      max-width: min(80%, 610px);
      padding: 12px 14px;
      border-radius: 15px 15px 15px 4px;
      color: #30342f;
      background: #f1f4ef;
      line-height: 1.65;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble {
      border-radius: 15px 15px 4px 15px;
      color: #fff;
      background: var(--green);
    }
    .bubble.error { color: #a34235; background: #fff0ed; }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 22px 15px;
    }
    .chip {
      padding: 7px 11px;
      border: 1px solid var(--line);
      color: #566057;
      background: #fbfcfa;
      font-size: 12px;
    }
    .chip:hover { border-color: #b4d1bd; color: var(--green); background: var(--green-soft); }

    .chat-form {
      display: flex;
      gap: 10px;
      padding: 15px 22px 20px;
      border-top: 1px solid var(--line);
    }
    .chat-form input { min-width: 0; flex: 1; }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--ink);
      background: #fff;
    }
    input:focus, select:focus { border-color: #7fb493; box-shadow: 0 0 0 3px rgba(127, 180, 147, 0.16); }

    .side { display: grid; gap: 18px; }
    .side .card { padding: 20px; }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .section-title h2 { font-size: 17px; }
    .section-title span { color: var(--muted); font-size: 12px; }
    .section-description { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .inline-form { display: flex; gap: 8px; margin-top: 15px; }
    .inline-form input { min-width: 0; }
    .inline-form .primary-button { flex: 0 0 auto; }
    .faq-hints { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .faq-results { display: grid; gap: 8px; margin-top: 14px; }
    .faq-item {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfa;
    }
    .faq-item button { padding: 0; border: 0; color: var(--green); background: transparent; text-align: left; font-weight: 650; }
    .faq-item p { margin-top: 5px; color: #667066; font-size: 12px; line-height: 1.55; }
    .empty { color: var(--muted); font-size: 13px; }

    .delivery-form { display: grid; gap: 10px; margin-top: 15px; }
    .delivery-form .primary-button { width: 100%; }
    .delivery-result {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding: 13px;
      border: 1px solid #bfe0c9;
      border-radius: 13px;
      background: var(--green-soft);
    }
    .delivery-result.out-range { border-color: #f0d4a5; background: var(--orange-soft); }
    .delivery-result strong { color: var(--green); font-size: 14px; }
    .delivery-result.out-range strong { color: #a96518; }
    .delivery-main { font-size: 13px; line-height: 1.55; }
    .delivery-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.66); }
    .stat span { display: block; color: var(--muted); font-size: 11px; }
    .stat b { display: block; margin-top: 3px; font-size: 14px; }
    .footnote { margin-top: 15px; color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .chat-card { min-height: 580px; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 20px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .top-actions { justify-content: space-between; }
      .card-head, .messages { padding-left: 16px; padding-right: 16px; }
      .quick-row { padding-left: 16px; padding-right: 16px; }
      .chat-form { padding-left: 16px; padding-right: 16px; }
      .chat-form { flex-direction: column; }
      .chat-form .primary-button { width: 100%; }
      .bubble { max-width: 86%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🍜</div>
        <div>
          <h1>六合餐厅 · 智能助手</h1>
          <p class="subtitle">菜单、预约、配送，一问即答</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="api-status" class="status" role="status">正在检查接口</span>
        <button id="new-chat" class="ghost-button" type="button">新会话</button>
      </div>
    </header>

    <section class="layout">
      <section class="card chat-card" aria-labelledby="chat-title">
        <div class="card-head">
          <div>
            <h2 id="chat-title">和餐厅聊聊</h2>
            <p>支持连续对话，回答会实时返回</p>
          </div>
          <span class="status online">Agent</span>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <div class="quick-row" aria-label="快捷提问">
          <button class="chip chat-chip" type="button" data-question="营业时间是什么时候？">营业时间</button>
          <button class="chip chat-chip" type="button" data-question="你们餐厅在哪里？">餐厅地址</button>
          <button class="chip chat-chip" type="button" data-question="推荐一道适合喜欢吃辣的菜。">推荐菜品</button>
        </div>

        <form id="chat-form" class="chat-form">
          <input id="chat-input" name="query" autocomplete="off" placeholder="例如：你们有什么特色菜？" aria-label="聊天内容" />
          <button id="chat-submit" class="primary-button" type="submit">发送</button>
        </form>
      </section>

      <aside class="side">
        <section class="card" aria-labelledby="faq-title">
          <div class="section-title">
            <h2 id="faq-title">常见问题</h2>
            <span>FAQ</span>
          </div>
          <p class="section-description">从知识库里找最接近的答案，点问题可带回聊天框。</p>
          <form id="faq-form" class="inline-form">
            <input id="faq-input" autocomplete="off" placeholder="搜索：营业时间" aria-label="FAQ搜索" />
            <button class="primary-button" type="submit">搜索</button>
          </form>
          <div class="faq-hints">
            <button class="chip faq-chip" type="button" data-query="营业时间">营业时间</button>
            <button class="chip faq-chip" type="button" data-query="优惠活动">优惠活动</button>
            <button class="chip faq-chip" type="button" data-query="停车">停车</button>
          </div>
          <div id="faq-results" class="faq-results" aria-live="polite">
            <span class="empty">输入问题后点击搜索</span>
          </div>
        </section>

        <section class="card" aria-labelledby="delivery-title">
          <div class="section-title">
            <h2 id="delivery-title">配送查询</h2>
            <span>5 km 范围</span>
          </div>
          <p class="section-description">填写地址和出行方式，查询配送距离与预计时间。</p>
          <form id="delivery-form" class="delivery-form">
            <input id="delivery-address" autocomplete="street-address" value="上海人民广场" placeholder="请输入配送地址" aria-label="配送地址" />
            <select id="travel-mode" aria-label="出行方式">
              <option value="1">骑行</option>
              <option value="2">驾车</option>
              <option value="3">直线距离</option>
            </select>
            <button id="delivery-submit" class="primary-button" type="submit">查询配送</button>
          </form>
          <div id="delivery-result" aria-live="polite">
            <p class="footnote">默认地址可直接点击查询。</p>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const messages = $("#messages");
    const chatForm = $("#chat-form");
    const chatInput = $("#chat-input");
    const chatSubmit = $("#chat-submit");
    const apiStatus = $("#api-status");
    let threadId = createThreadId();
    let chatBusy = false;

    function createThreadId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function setApiStatus(text, state = "") {
      apiStatus.textContent = text;
      apiStatus.className = `status ${state}`.trim();
    }

    function addMessage(role, content) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "我" : "🍜";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;
      row.append(avatar, bubble);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function showWelcome() {
      addMessage("assistant", "你好，我是六合餐厅助手。\n可以问我营业时间、特色菜、预约或配送范围。👋");
    }

    function readError(response, fallback) {
      return response.text().then((text) => {
        try {
          const data = JSON.parse(text);
          return data.detail || fallback;
        } catch {
          return text || fallback;
        }
      });
    }

    function consumeSseBlock(block, onToken) {
      const data = block
        .split(/\r?\n/)
        .filter((line) => line.startsWith("data:"))
        .map((line) => line.slice(5).trim())
        .join("\n");
      if (!data || data === "[DONE]") return;
      const payload = JSON.parse(data);
      if (payload.type === "token" && payload.content) onToken(payload.content);
    }

    async function consumeSse(response, onToken) {
      if (!response.body) throw new Error("服务没有返回流式内容");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const consumeBuffer = () => {
        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || "";
        blocks.forEach((block) => consumeSseBlock(block, onToken));
      };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        consumeBuffer();
      }
      buffer += decoder.decode();
      if (buffer.trim()) consumeSseBlock(buffer, onToken);
    }

    async function ask(query) {
      const text = query.trim();
      if (!text || chatBusy) return;
      chatBusy = true;
      chatInput.value = "";
      chatSubmit.disabled = true;
      document.querySelectorAll(".chat-chip").forEach((button) => { button.disabled = true; });
      addMessage("user", text);
      const answer = addMessage("assistant", "正在连接 Agent…");
      let received = false;
      setApiStatus("回答生成中", "online");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, thread_id: threadId }),
        });
        if (!response.ok) throw new Error(await readError(response, `HTTP ${response.status}`));
        await consumeSse(response, (chunk) => {
          if (!received) {
            answer.textContent = "";
            received = true;
          }
          answer.textContent += chunk;
          messages.scrollTop = messages.scrollHeight;
        });
        if (!received) answer.textContent = "Agent 没有返回文本，请换个问题再试。";
        setApiStatus("接口在线", "online");
      } catch (error) {
        answer.classList.add("error");
        answer.textContent = `请求失败：${error.message || "请检查后端服务"}`;
        setApiStatus("请求失败", "error");
      } finally {
        chatBusy = false;
        chatSubmit.disabled = false;
        document.querySelectorAll(".chat-chip").forEach((button) => { button.disabled = false; });
        chatInput.focus();
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      ask(chatInput.value);
    });

    document.querySelectorAll(".chat-chip").forEach((button) => {
      button.addEventListener("click", () => ask(button.dataset.question));
    });

    $("#new-chat").addEventListener("click", () => {
      if (chatBusy) return;
      threadId = createThreadId();
      messages.replaceChildren();
      showWelcome();
      setApiStatus("新会话已创建", "online");
      chatInput.focus();
    });

    async function searchFaq(query) {
      const text = query.trim();
      const results = $("#faq-results");
      if (!text) {
        results.replaceChildren();
        const empty = document.createElement("span");
        empty.className = "empty";
        empty.textContent = "请输入要搜索的问题";
        results.append(empty);
        return;
      }
      results.replaceChildren();
      const loading = document.createElement("span");
      loading.className = "empty";
      loading.textContent = "正在查询…";
      results.append(loading);
      try {
        const params = new URLSearchParams({ query: text, limit: "2" });
        const response = await fetch(`/faq/suggest?${params.toString()}`);
        if (!response.ok) throw new Error(await readError(response, `HTTP ${response.status}`));
        const data = await response.json();
        results.replaceChildren();
        if (!data.suggestions || data.suggestions.length === 0) {
          const empty = document.createElement("span");
          empty.className = "empty";
          empty.textContent = "没有找到相近问题，试试换个说法。";
          results.append(empty);
        } else {
          data.suggestions.forEach((item) => {
            const card = document.createElement("div");
            card.className = "faq-item";
            const question = document.createElement("button");
            question.type = "button";
            question.textContent = item.question;
            question.addEventListener("click", () => {
              chatInput.value = item.question;
              chatInput.focus();
              setApiStatus("问题已填入聊天框", "online");
            });
            const answer = document.createElement("p");
            answer.textContent = item.answer;
            card.append(question, answer);
            results.append(card);
          });
        }
        setApiStatus("接口在线", "online");
      } catch (error) {
        results.replaceChildren();
        const failure = document.createElement("span");
        failure.className = "empty";
        failure.textContent = `查询失败：${error.message || "请检查后端服务"}`;
        results.append(failure);
        setApiStatus("请求失败", "error");
      }
    }

    $("#faq-form").addEventListener("submit", (event) => {
      event.preventDefault();
      searchFaq($("#faq-input").value);
    });

    document.querySelectorAll(".faq-chip").forEach((button) => {
      button.addEventListener("click", () => {
        $("#faq-input").value = button.dataset.query;
        searchFaq(button.dataset.query);
      });
    });

    function addDeliveryStat(parent, label, value) {
      const stat = document.createElement("div");
      stat.className = "stat";
      const labelNode = document.createElement("span");
      labelNode.textContent = label;
      const valueNode = document.createElement("b");
      valueNode.textContent = value;
      stat.append(labelNode, valueNode);
      parent.append(stat);
    }

    function renderDelivery(data) {
      const result = $("#delivery-result");
      result.replaceChildren();
      const box = document.createElement("div");
      box.className = `delivery-result ${data.in_range ? "" : "out-range"}`.trim();
      const title = document.createElement("strong");
      title.textContent = data.in_range ? "在配送范围内" : "暂不在配送范围内";
      const main = document.createElement("div");
      main.className = "delivery-main";
      main.textContent = `${data.address} · ${data.travel_mode || "当前方式"}`;
      const stats = document.createElement("div");
      stats.className = "delivery-stats";
      addDeliveryStat(stats, "距离", `${data.distance_km} km`);
      addDeliveryStat(stats, "预计时间", data.duration_min == null ? "—" : `${data.duration_min} 分钟`);
      const note = document.createElement("div");
      note.className = "delivery-main";
      note.textContent = data.message || "已完成查询";
      box.append(title, main, stats, note);
      result.append(box);
    }

    $("#delivery-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const addressInput = $("#delivery-address");
      const address = addressInput.value.trim();
      const button = $("#delivery-submit");
      if (!address) {
        addressInput.focus();
        setApiStatus("请填写配送地址", "error");
        return;
      }
      button.disabled = true;
      setApiStatus("配送查询中", "online");
      try {
        const response = await fetch("/delivery", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ address, travel_mode: $("#travel-mode").value }),
        });
        if (!response.ok) throw new Error(await readError(response, `HTTP ${response.status}`));
        renderDelivery(await response.json());
        setApiStatus("接口在线", "online");
      } catch (error) {
        const result = $("#delivery-result");
        result.replaceChildren();
        const failure = document.createElement("p");
        failure.className = "footnote";
        failure.textContent = `查询失败：${error.message || "请检查后端服务"}`;
        result.append(failure);
        setApiStatus("请求失败", "error");
      } finally {
        button.disabled = false;
      }
    });

    async function checkApi() {
      try {
        const response = await fetch("/openapi.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        setApiStatus("接口在线", "online");
      } catch (error) {
        setApiStatus(`接口不可用：${error.message}`, "error");
      }
    }

    showWelcome();
    checkApi();
  </script>
</body>
</html>
